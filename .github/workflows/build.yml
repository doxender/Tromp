name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Test, lint, and assemble debug
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tromp-debug-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Restore protected release signing key
        env:
          TROMP_KEYSTORE_B64: ${{ secrets.TROMP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TROMP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TROMP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TROMP_KEY_PASSWORD }}
        run: |
          test -n "$TROMP_KEYSTORE_B64"
          echo "$TROMP_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tromp-release.jks"
          echo "TROMP_KEYSTORE_PATH=$RUNNER_TEMP/tromp-release.jks" >> "$GITHUB_ENV"
          echo "TROMP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TROMP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TROMP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
